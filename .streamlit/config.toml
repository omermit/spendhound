[theme]
base = "light"
primaryColor = "#1D5FD6"
backgroundColor = "#F4F5F7"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#16202E"
borderColor = "#E3E6EB"
font = "IBM Plex Sans"
codeFont = "IBM Plex Mono"
baseFontSize = 13
baseRadius = "6px"
showWidgetBorder = true

# IBM Plex Sans is served as one variable font file covering all weights.
[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "https://fonts.gstatic.com/s/ibmplexsans/v23/zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYY.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "https://fonts.gstatic.com/s/ibmplexsans/v23/zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYY.woff2"
weight = 500

[[theme.fontFaces]]
family = "IBM Plex Sans"
url = "https://fonts.gstatic.com/s/ibmplexsans/v23/zYXzKVElMYYaJe8bpLHnCwDKr932-G7dytD-Dmu1syxeKYY.woff2"
weight = 600

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "https://fonts.gstatic.com/s/ibmplexmono/v23/-F63fjptAgt5VM-kVkqdyU8n1i8q1w.woff2"
weight = 400

[[theme.fontFaces]]
family = "IBM Plex Mono"
url = "https://fonts.gstatic.com/s/ibmplexmono/v23/-F6qfjptAgt5VM-kVkqdyU8n3twJwlBFgg.woff2"
weight = 500

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[server]
headless = true

[browser]
gatherUsageStats = false
